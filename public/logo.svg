<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Radial Ambient Neon Glow -->
    <radialGradient id="omegaGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#B8F34A" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#B8F34A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#B8F34A" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Neon Metallic Gradient for Omega Symbol -->
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF80"/>
      <stop offset="45%" stop-color="#B8F34A"/>
      <stop offset="100%" stop-color="#8CE81F"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Athletic Pop -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#B8F34A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Background Container (matches #0B0D10 FitApp theme) -->
  <rect width="200" height="200" rx="44" fill="#0B0D10"/>
  <rect x="4" y="4" width="192" height="192" rx="40" stroke="#292F38" stroke-width="4"/>
  <rect x="5" y="5" width="190" height="190" rx="39" stroke="#B8F34A" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Radial Aura Glow behind the Omega symbol -->
  <circle cx="100" cy="94" r="76" fill="url(#omegaGlow)"/>

  <!-- Greek Letter Omega (Ω) Athletic Cutout Path -->
  <path d="M 34 156 L 34 136 L 60 136 A 58 58 0 1 1 140 136 L 166 136 L 166 156 L 126 156 C 120 156 116 142 118 122 A 33.5 33.5 0 1 0 82 122 C 84 142 80 156 74 156 Z"
        fill="url(#omegaGrad)"
        filter="url(#neonShadow)" />

  <!-- Subtle Inner Accent Dots (signature athletic detail) -->
  <circle cx="48" cy="146" r="3.5" fill="#0B0D10" opacity="0.6"/>
  <circle cx="152" cy="146" r="3.5" fill="#0B0D10" opacity="0.6"/>
</svg>
